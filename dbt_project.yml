name: 'proactive_health'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  proactive_health:
    base:
      +materialized: view
      +schema: STG_EHP
    cur:
      +materialized: table
      +schema: CUR_EHP